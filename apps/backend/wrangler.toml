name = "map-project-backend"
main = "src/app.js"
compatibility_date = "2026-06-05"

[[d1_databases]]
binding = "DB"
database_name = "map-project-db"
database_id = "map-project-db-local"

[[r2_buckets]]
binding = "R2"
bucket_name = "map-project-images"

# Environment variables: use .dev.vars for local development secrets.
# Production vars are set via Cloudflare dashboard or wrangler deploy --var.
