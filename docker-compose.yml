version: '3.9'

services:
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: postgres18_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 5

  geoserver:
    image: kartoza/geoserver:2.28.2
    container_name: geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-postgres}
      SAMPLE_DATA: 'false'
    ports:
      - '8080:8080'
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:8080/geoserver/web || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  geoserver_data:
